apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cats-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/emiliKyrylova/devops-labs.git'
    targetRevision: HEAD
    path: helm-chart
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: cats-namespace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true