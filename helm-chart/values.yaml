replicaCount: 2

image:
  repository: cats-registry
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 8000
  nodePort: 30081

config:
  environment: "development"
  title: "Реєстр бойових котів"

ingress:
  enabled: false

  rollout:
    enabled: true
    strategy:
      canary:
        steps:
          - setWeight: 20
          - pause: { }          # Ручна пауза (вимагає команди promote)
          - setWeight: 60
          - pause: { duration: 30s }
          - setWeight: 80

            replicaCount: 2

            image:
              repository: cats-registry
              tag: "1.0.0"
              pullPolicy: IfNotPresent

            service:
              type: NodePort
              port: 8000
              nodePort: 30081

            config:
              environment: "development"
              title: "Реєстр бойових котів"

            ingress:
              enabled: false

            rollout:
              enabled: true
              strategy:
                canary:
                  steps:
                    - setWeight: 20
                    - pause: { }
                    - setWeight: 60
                    - pause: { duration: 30s }
                    - setWeight: 80