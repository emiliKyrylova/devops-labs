apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: cats-registry-rollout
  namespace: cats-namespace
  labels:
    app: cats-web
    release: cats-release
spec:
  replicas: 4
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: cats-web
      release: cats-release
  template:
    metadata:
      labels:
        app: cats-web
        release: cats-release
    spec:
      containers:
      - name: web
        image: "cats-registry:1.2.0"
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: cats-release-secret
              key: DATABASE_URL
        - name: APP_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: cats-release-config
              key: APP_ENVIRONMENT
  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause: {}
        - setWeight: 60
        - pause: {duration: 30s}
        - setWeight: 80